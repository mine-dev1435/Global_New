<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/img/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Abroad Consultants in Coimbatore | The Global Ties</title>
  <meta name="description"
    content="The Global Ties is the leading study abroad consultancy in Coimbatore. Offering comprehensive overseas education counseling, university admissions, and visa support." />
  <meta name="keywords"
    content="Study Abroad Consultants in Coimbatore, Study in Canada, Study in UK, Study in Australia, Study in USA, Study in Germany, MBBS Abroad, IELTS Coaching, PTE Coaching" />

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap"
    rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <!-- AOS Animation CSS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

  <!-- Main Custom CSS -->
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/main.css?v=3">
  <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Bootstrap 5 JS Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- AOS Animation JS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    // Wait for React to render
    window.addEventListener('load', function () {
      // Initialize AOS animations
      AOS.init({
        duration: 800,
        easing: 'ease-in-out',
        once: true,
        offset: 100
      });

      // Initialize Swiper
      const coursesSwiper = new Swiper(".coursesSwiper", {
        slidesPerView: 1,
        spaceBetween: 30,
        autoplay: {
          delay: 3000,
          disableOnInteraction: false,
        },
        loop: true,
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: '.swiper-btn-next',
          prevEl: '.swiper-btn-prev',
        },
        breakpoints: {
          768: { slidesPerView: 2 },
          1200: { slidesPerView: 3 }
        }
      });

      // Navbar and Scroll-to-Top effect
      window.addEventListener('scroll', function () {
        // Navbar
        const navbar = document.querySelector('.navbar');
        if (navbar) {
          if (window.scrollY > 50) {
            navbar.style.padding = '10px 0';
            navbar.style.boxShadow = '0 4px 20px rgba(0,0,0,0.1)';
          } else {
            navbar.style.padding = '15px 0';
            navbar.style.boxShadow = '0 4px 20px rgba(0,0,0,0.05)';
          }
        }

        // Scroll to top button
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        if (scrollTopBtn) {
          if (window.scrollY > 300) {
            scrollTopBtn.classList.add('show');
          } else {
            scrollTopBtn.classList.remove('show');
          }
        }
      });

      // Scroll to top click handler
      document.body.addEventListener('click', function (e) {
        const btn = e.target.closest('#scrollTopBtn');
        if (btn) {
          e.preventDefault();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    });

    // Global Slider Logic for SPA
    window.toggleCard = function (event, btn) {
      event.preventDefault();
      const cardText = btn.previousElementSibling;
      cardText.classList.toggle('expanded');
      if (cardText.classList.contains('expanded')) {
        btn.innerHTML = 'Read Less &uarr;';
      } else {
        btn.innerHTML = 'Read More &rarr;';
      }
    };

    window.sliderStates = {
      opp: { current: 0 },
      reel: { current: 0 }
    };

    window.updateSlider = function (type) {
      const track = document.getElementById(type + '-track');
      if (!track) return;
      const pagination = document.getElementById(type + '-pagination');
      const dots = pagination ? pagination.querySelectorAll('.dot') : [];
      const slideSelector = type === 'opp' ? '.opp-slide' : '.reel-slide';
      const slides = track.querySelectorAll(slideSelector);
      if (slides.length === 0) return;

      const slideWidth = slides[0].offsetWidth;
      const maxScroll = Math.max(0, track.scrollWidth - track.parentElement.offsetWidth);

      let current = window.sliderStates[type].current;
      let translation = current * slideWidth;
      if (translation > maxScroll) {
        translation = maxScroll;
      }

      track.style.transform = `translateX(-${translation}px)`;

      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === current);
      });
    };

    window.moveSlideCommon = function (type, direction) {
      const track = document.getElementById(type + '-track');
      if (!track) return;
      const slideSelector = type === 'opp' ? '.opp-slide' : '.reel-slide';
      const slides = track.querySelectorAll(slideSelector);
      if (slides.length === 0) return;

      const slideWidth = slides[0].offsetWidth;
      const maxScroll = Math.max(0, track.scrollWidth - track.parentElement.offsetWidth);
      let current = window.sliderStates[type].current;

      if (direction > 0 && current * slideWidth >= maxScroll) {
        current = 0;
      } else if (direction < 0 && current === 0) {
        current = Math.ceil(maxScroll / slideWidth);
      } else {
        current += direction;
      }

      window.sliderStates[type].current = current;
      window.updateSlider(type);
    };

    window.goToSlideCommon = function (type, index) {
      window.sliderStates[type].current = index;
      window.updateSlider(type);
    };

    window.moveSlide = function (direction) { window.moveSlideCommon('opp', direction); };
    window.goToSlide = function (index) { window.goToSlideCommon('opp', index); };
    window.moveReelSlide = function (direction) { window.moveSlideCommon('reel', direction); };
    window.goToReelSlide = function (index) { window.goToSlideCommon('reel', index); };

    // Optional: Auto-slide interval can be handled with a MutationObserver to detect when sliders enter the DOM,
    // but manual navigation (next/prev) is the primary user request and will now work globally.
  </script>
</body>

</html>
